# The loop trace is what a lesson run is read for, so keep it legible: no thread name, and the
# class alone rather than its whole package.
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showShortLogName=true

# slf4j-simple writes to System.err by default, which interleaves unpredictably with the runners'
# own System.out. One stream keeps the order of a run truthful.
org.slf4j.simpleLogger.logFile=System.out